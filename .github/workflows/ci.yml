name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Personal-value check (emails, IPs, MACs)
        run: python3 tests/check_repo.py
      - name: Shell syntax
        run: bash -n netprobe.sh

  changelog:
    # Flag visible changes without a changelog line.
    if: endsWith(github.repository, '-private')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog check
        run: python3 scripts/release/changelog_check.py
